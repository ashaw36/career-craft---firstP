[package]
name = "careercraft"
version = "0.1.0"
description = "CareerCraft desktop application"
edition = "2021"
default-run = "careercraft-desktop"

[lib]
name = "careercraft_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
flate2 = "1.1"
fs2 = "0.4"
quick-xml = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
thiserror = "2"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]
wdio = ["desktop", "dep:tauri-plugin-wdio-webdriver"]
updater = ["desktop", "dep:tauri-plugin-updater"]

[[bin]]
name = "careercraft-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "w7-gate"
path = "src/bin/w7_gate.rs"

[dev-dependencies]
tempfile = "3"
